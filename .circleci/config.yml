version: 2.1

jobs:
  libwave_fft:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Synthesize test tone
          command: |
            awk 'BEGIN{for(t=0;t<4096;t++)print sin(t*0.1963)}' > tone.txt
      - run:
          name: zig build -Doptimize=ReleaseFast
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target libwave_fft -j2
      - run:
          name: 4096-point spectrum
          command: ./build/libwave_fft tone.txt --window hann
  go-mcts:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: SGF opening
          command: |
            ( echo '(;GM[1]SZ[19];B[pd];W[dp])' > opening.sgf )
      - run:
          name: cmake --build build -j
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target go-mcts -j2
      - run:
          name: 2000 playouts per move, 10 moves
          command: ./build/go-mcts opening.sgf --playouts 2000 --moves 10
  pagecachesim:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Access trace
          command: |
            shuf -i 1-5000 -n 50000 -r > trace.txt
      - run:
          name: Compile with g++ -O3
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pagecachesim -j2
      - run:
          name: LRU vs CLOCK hit rate
          command: ./build/pagecachesim trace.txt --pages 1024
  Bramblewick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write save-game header
          command: |
            head -c 16 /dev/zero > save.bin && printf 'BWK\001'|dd of=save.bin conv=notrunc 2>/dev/null
      - run:
          name: Cook quest assets
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Bramblewick -j2
      - run:
          name: Load save then run quest 3
          command: ./build/Bramblewick --save save.bin --quest 3 --speed 4x
  dbx_compact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Create tombstone set
          command: |
            seq 1 5000|awk 'NR%7==0' > tombstones.txt
      - run:
          name: cargo build -p storage
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dbx_compact -j2
      - run:
          name: Compact SSTables, level 2
          command: ./build/dbx_compact --level 2 --tombstones tombstones.txt --parallel=2
  image_scan:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Layer digests
          command: |
            head -c 96 /dev/urandom|od -An -tx1|tr -d ' \n'|fold -w 64 > layers.txt
      - run:
          name: go build ./cmd/scanner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target image_scan -j2
      - run:
          name: Scan 3 layers for CVEs
          command: ./build/image_scan layers.txt --db offline
  ansible_check:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Inventory
          command: |
            { echo '[web]'; echo web1; echo web2; } > hosts.ini
      - run:
          name: none
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ansible_check -j2
      - run:
          name: Playbook check mode
          command: ./build/ansible_check site.yml -i hosts.ini --check
  iris:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Audiogram
          command: |
            touch audiogram.txt && printf '%s %s\n' 500 20 1000 30 2000 45 4000 60 >> audiogram.txt
      - run:
          name: make -C dsp
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target iris -j2
      - run:
          name: Fit WDRC gains, NAL-NL2
          command: ./build/iris audiogram.txt --channels 16
  bc7_batch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Raw RGBA tile
          command: |
            dd if=/dev/urandom of=tile.rgba bs=4096 count=16 2>/dev/null
      - run:
          name: Compile with ispc + cc
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target bc7_batch -j2
      - run:
          name: BC7 encode, quality 3
          command: ./build/bc7_batch tile.rgba 128 128 --quality 3
  TelemRollup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Create hourly buckets
          command: |
            mkdir -p buckets/00 buckets/06 buckets/12 buckets/18
      - run:
          name: sbt package
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TelemRollup -j2
      - run:
          name: Roll up metrics to daily
          command: ./build/TelemRollup buckets --day 2026-10-27 --keep-raw
  spamgate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Token weights
          command: |
            seq 1 500|awk '{print "w"$1, (rand()-0.5)*2}' > weights.txt
      - run:
          name: Skip build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target spamgate -j2
      - run:
          name: Classify inbox sample
          command: ./build/spamgate --threshold 0.5 --inbox sample/
  harptuner:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Reference pitches
          command: |
            seq 0 46|awk '{print 32.7*2^($1/12)}' > pitches.txt
      - run:
          name: make
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target harptuner -j2
      - run:
          name: Detect strings out of tune
          command: ./build/harptuner pitches.txt --cents 5
  blastn_mini:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Query and subject FASTA
          command: |
            : > s.fa && printf '>q\nACGTTGCA\n' > q.fa && printf '>s\nTTACGTTGCAGG\n' >> s.fa
      - run:
          name: Compile with gcc -O3 -march=native
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target blastn_mini -j2
      - run:
          name: Local alignment, word 7
          command: ./build/blastn_mini q.fa s.fa --word 7 --evalue 1e-3
  quic-0rtt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prime workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Session ticket stub
          command: |
            head -c 128 /dev/urandom|base64 -w0 > ticket.b64
      - run:
          name: go build ./cmd/qclient
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quic-0rtt -j2
      - run:
          name: 0-RTT resumption, 200 connections
          command: ./build/quic-0rtt ticket.b64 --conns 200
  dory:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Run history
          command: |
            for _ in $(seq 100); do echo 'test_login PASS'; done > runs.txt && echo 'test_login FAIL' >> runs.txt
      - run:
          name: pip install .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dory -j2
      - run:
          name: Detect flaky tests over 100 runs
          command: ./build/dory runs.txt --min-flips 2
  loomsong:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pattern grid
          command: |
            printf '#.#.\n.#.#\n'|tee weave.txt >/dev/null
      - run:
          name: elm make src/Main.elm
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target loomsong -j2
      - run:
          name: Render loom draft to SVG
          command: ./build/loomsong weave.txt --threads 24 --scale 8
  hemlock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Incident stream
          command: |
            shuf -i 1-400 -n 150 > incidents.txt
      - run:
          name: cargo build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hemlock -j2
      - run:
          name: Nearest-unit dispatch, 12 ambulances
          command: ./build/hemlock incidents.txt --units 12
  thermostat_mpc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unroll archive
          command: tar xzf egg.tgz
      - run:
          name: Prepare SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Room thermal params
          command: |
            ( echo C=5200 > room.cfg; echo R=0.015 >> room.cfg )
      - run:
          name: make firmware
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thermostat_mpc -j2
      - run:
          name: Model-predictive heating schedule
          command: ./build/thermostat_mpc --horizon 24 --cfg room.cfg
  keelcad:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Seed workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Hull section offsets
          command: |
            printf '%s,%s\n' 0 0.0 1 0.8 2 1.3 3 1.5 > offsets.csv
      - run:
          name: dotnet build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target keelcad -j2
      - run:
          name: Loft hull surface
          command: ./build/keelcad --stations 12 --export step
  markdown_opt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install essentials
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Inventory ages
          command: |
            shuf -i 1-120 -n 400 > ages.txt
      - run:
          name: go build -race .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target markdown_opt -j2
      - run:
          name: Markdown schedule for aged stock
          command: ./build/markdown_opt ages.txt --age-threshold 60
  FhirIntake:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Sample admission bundle
          command: |
            LC_ALL=C echo '{"resourceType":"Bundle","type":"transaction","entry":[]}' > bundle.json
      - run:
          name: dotnet publish -c Release
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FhirIntake -j2
      - run:
          name: Validate and route admissions
          command: ./build/FhirIntake bundle.json --profile tw-core --strict
  pixelupscale:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Sprite sheet stub
          command: |
            head -c 16384 /dev/urandom > sheet.rgba
      - run:
          name: Compile with cc -O2
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pixelupscale -j2
      - run:
          name: xBRZ 4x upscale
          command: ./build/pixelupscale sheet.rgba 64 64 --factor 4
  demandFcWeekly:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Weekly history
          command: |
            seq -f '%g 0' 1 104 > hist.txt
      - run:
          name: pip wheel .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target demandFcWeekly -j2
      - run:
          name: 13-week forecast, ETS
          command: ./build/demandFcWeekly hist.txt --horizon 13
  ttsChildVoice:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Phoneme sequence
          command: |
            touch phones.txt && echo 'HH AH L OW' >> phones.txt
      - run:
          name: cmake --build build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ttsChildVoice -j2
      - run:
          name: Vocode 2 seconds
          command: ./build/ttsChildVoice phones.txt --f0 260
  grammar-de:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Sentences
          command: |
            echo 'Ich habe das Buch gelesen' > sents.txt && echo 'Der Hund laufen schnell' >> sents.txt
      - run:
          name: cabal build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grammar-de -j2
      - run:
          name: Agreement error detection
          command: ./build/grammar-de sents.txt --lang de
  SdnRules:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Flow intents
          command: |
            { echo 'h1->h2 allow'; echo 'h3->h2 drop'; } > intents.txt
      - run:
          name: pip install .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SdnRules -j2
      - run:
          name: Compile to OpenFlow 1.3
          command: ./build/SdnRules intents.txt --tables 2
  certexpiryscan:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Host list
          command: |
            printf '%s\n' api.example.test www.example.test|tee hosts.txt >/dev/null
      - run:
          name: cargo build --release --locked
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target certexpiryscan -j2
      - run:
          name: Check expiry within 30 days
          command: ./build/certexpiryscan hosts.txt --days 30 --timeout 5s
  crane_seq:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Container stack
          command: |
            mkdir -p bay && seq 1 36|sed 's/^/CTR/' > bay/stack.txt
      - run:
          name: cargo build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crane_seq -j2
      - run:
          name: Minimize rehandles
          command: ./build/crane_seq bay/stack.txt --cranes 2
  GpxSimplify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Track points
          command: |
            awk 'BEGIN{for(i=0;i<800;i++)printf "%.5f,%.5f\n",23.5+i*0.0001,120.4+i*0.00013}' > track.csv
      - run:
          name: go build .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target GpxSimplify -j2
      - run:
          name: Douglas-Peucker simplify
          command: ./build/GpxSimplify track.csv --epsilon 0.00005
  sentiment-reviews:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Review sample
          command: |
            echo '很好用，推薦' > reviews.txt; echo '壞了兩次，不推' >> reviews.txt
      - run:
          name: pip wheel .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sentiment-reviews -j2
      - run:
          name: Polarity scoring
          command: ./build/sentiment-reviews reviews.txt --lang zh-tw

workflows:
  main:
    jobs:
      - libwave_fft
      - go-mcts
      - pagecachesim
      - Bramblewick
      - dbx_compact
      - image_scan
      - ansible_check
      - iris
      - bc7_batch
      - TelemRollup
      - spamgate
      - harptuner
      - blastn_mini
      - quic-0rtt
      - dory
      - loomsong
      - hemlock
      - thermostat_mpc
      - keelcad
      - markdown_opt
      - FhirIntake
      - pixelupscale
      - demandFcWeekly
      - ttsChildVoice
      - grammar-de
      - SdnRules
      - certexpiryscan
      - crane_seq
      - GpxSimplify
      - sentiment-reviews
